[workspace]
members = ["crates/*"]
exclude = ["simulator/backends/qemu/axi-iic"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", features = ["compress"] }
hex = "=0.4.3"
clap = { version = "=4.6.0", features = ["derive"] }
libc = "=0.2.183"
tempfile = "=3.27.0"
bitcoin_hashes = "=0.14.1"

[profile.release]
overflow-checks = true

# Keep repeated workspace checks small. Frozen release helpers are separate.
[profile.dev]
debug = 0
incremental = false
